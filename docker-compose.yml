version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skillpilot_db
    environment:
      POSTGRES_USER: skillpilot
      POSTGRES_PASSWORD: skillpilot_password
      POSTGRES_DB: skillpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpilot -d skillpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillpilot_backend
    environment:
      DATABASE_URL: postgresql://skillpilot:skillpilot_password@db:5432/skillpilot
      SECRET_KEY: dev-jwt-secret-key-change-in-production
      LLM_PROVIDER: demo
      DEMO_MODE: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillpilot_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

